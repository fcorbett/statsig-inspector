<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Statsig Inspector fixture — network</title>
    <style>
      body { font: 16px/1.4 ui-sans-serif, system-ui; margin: 40px; max-width: 640px; }
      #status { font-family: ui-monospace, monospace; }
    </style>
  </head>
  <body>
    <h1>Live initialize + flush (dummy key, 401 expected)</h1>
    <p>Status: <span id="status">loading</span></p>
    <button id="cta">Click me</button>
    <script src="./payload.js"></script>
    <script src="./boot.js"></script>
    <script>
      (async () => {
        const { StatsigClient, runStatsigAutoCapture } = await FIXTURE.loadStatsig();
        const client = new StatsigClient(
          FIXTURE.DUMMY_KEY,
          FIXTURE.fixtureUser(),
          { environment: { tier: 'development' } },
        );
        runStatsigAutoCapture(client);
        try {
          await client.initializeAsync();
        } catch (err) {
          console.warn('initializeAsync expected to fail', err);
        }
        client.logEvent('fixture_click');
        try {
          await client.flush();
        } catch (err) {
          console.warn('flush expected to fail', err);
        }
        FIXTURE.setStatus(client.loadingStatus);
        window.__FIXTURE_CLIENT__ = client;
      })().catch((err) => FIXTURE.setStatus(String(err)));
    </script>
  </body>
</html>
