<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Statsig Inspector fixture — healthy</title>
    <style>
      body { font: 16px/1.4 ui-sans-serif, system-ui; margin: 40px; max-width: 640px; }
      button { padding: 8px 14px; font-size: 16px; }
      #status { font-family: ui-monospace, monospace; }
    </style>
  </head>
  <body>
    <h1>Healthy Statsig install</h1>
    <p>Offline bootstrap. No Statsig account required.</p>
    <p>Status: <span id="status">loading</span></p>
    <button id="cta">Click me</button>
    <p><a href="/no-init.html">no-init</a> · <a href="/no-userid.html">no-userid</a> · <a href="/no-replay.html">no-replay</a> · <a href="/replay-sampled-out.html">sampled-out</a> · <a href="/network.html">network</a></p>
    <script src="./payload.js"></script>
    <script src="./boot.js"></script>
    <script>
      (async () => {
        const { StatsigClient, runStatsigAutoCapture, runStatsigSessionReplay } =
          await FIXTURE.loadStatsig();
        const client = new StatsigClient(
          FIXTURE.DUMMY_KEY,
          FIXTURE.fixtureUser(),
          { environment: { tier: 'development' } },
        );
        runStatsigSessionReplay(client);
        runStatsigAutoCapture(client);
        FIXTURE.bootstrapClient(client, FIXTURE.fixtureUser(), FIXTURE_PAYLOAD);
        FIXTURE.setStatus(client.loadingStatus);
        window.__FIXTURE_CLIENT__ = client;
      })().catch((err) => FIXTURE.setStatus(String(err)));
    </script>
  </body>
</html>
